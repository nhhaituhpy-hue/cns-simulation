name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Disposable local PostgreSQL only; never point the integration suite at the
    # application's DATABASE_URL or a production service.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: scenario_test
          POSTGRES_PASSWORD: scenario_test_only
          POSTGRES_DB: cns_scenario_exams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenario_test -d cns_scenario_exams_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SCENARIO_EXAM_TEST_DATABASE_URL: postgresql://scenario_test:scenario_test_only@127.0.0.1:5432/cns_scenario_exams_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test:run

      - name: Production build
        run: npm run build
        env:
          # The build prerenders client pages that initialize Supabase. These
          # placeholders validate configuration without granting CI data access.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Audit high-severity production dependencies
        run: npm audit --omit=dev --audit-level=high || true
