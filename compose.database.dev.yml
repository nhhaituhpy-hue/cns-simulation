name: cns-simulator-database-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cns_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-cns_simulator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cns-simulator-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cns_simulator} -d ${POSTGRES_DB:-cns_simulator}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cns-simulator-postgres-dev:
